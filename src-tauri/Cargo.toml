[package]
name = "zeroflow"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Circle to Search for Linux — Tauri + Svelte port of CircleFlow"
repository = "https://github.com/ens-Emilio/ZeroFlow"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

# Desktop integration
ashpd = { version = "0.13", features = ["screenshot"] }  # xdg-desktop-portal
notify-rust = "4"                     # libnotify
dirs = "5"                            # XDG paths

# Capture / image
image = { version = "0.25", features = ["jpeg", "png"] }
base64 = "0.22"

# shortcut: leptess/rxing/cpal/pipewire/reqwest enter in their phases; Cargo.toml
# stays buildable with only what Phase 0 needs.

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
