[package]
name = "zeroflow"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Circle to Search for Linux — Tauri + Svelte port of CircleFlow"
repository = "https://github.com/ens-Emilio/ZeroFlow"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

# Desktop integration
ashpd = { version = "0.13", features = ["screenshot"] }  # xdg-desktop-portal
notify-rust = "4"                     # libnotify
dirs = "5"                            # XDG paths

# Capture / image
image = { version = "0.25", features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json"] }
rfd = "0.15"
rxing = "0.8"
leptess = "0.14"  # Tesseract OCR wrapper
base64 = "0.22"

# shortcut: cpal/pipewire enter in their phases
# stays buildable with only what Phase 0 needs.

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
urlencoding = "2.1.3"
scraper = "0.27.0"
mime = "0.3.17"
cookie_store = "0.22.1"
rand = "0.10.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
